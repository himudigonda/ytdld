[project]
name = "ytdld"
version = "2.0.0"
description = "Parallel YouTube → MP3/MP4 downloader with a real-time TUI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["youtube", "downloader", "yt-dlp", "music", "tui"]

dependencies = [
    "questionary>=2.1.1",
    "rich>=14.2.0",
    "yt-dlp>=2025.12.8",
]

[project.scripts]
edm = "edm_pipeline.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edm_pipeline"]

[dependency-groups]
dev = [
    "hatchling>=1.30.1",
]
